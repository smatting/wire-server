name: Publish release

run-name: Publish v${{ inputs.version }} (by @${{ github.actor }})

on:
  workflow_call:
    inputs:
      version:
        description: 'Target version to publish, as computed by prepare-release'
        type: string
        required: true
      release_id:
        description: 'Numeric id of the draft GitHub Release created by prepare-release'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version to publish (X.Y.Z or X.Y.Z-<channel>.N): recovery path, resolves the draft release by tag'
        type: string
        required: true

permissions: {}

jobs:
  publish:
    name: Publish
    environment:
      name: release-publication
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github
          persist-credentials: false

      - name: Checkout the scripts of wire-rm-actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wireapp/wire-rm-actions
          ref: 813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
          path: rm-actions
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve the draft release and download the candidate
        id: draft
        uses: wireapp/wire-rm-actions/draft-release@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: resolve
          version: ${{ inputs.version }}
          release-id: ${{ inputs.release_id }}
          download: all
          asset-dir: ${{ runner.temp }}/candidate

      - name: Verify the candidate against its manifests
        id: verify
        env:
          MANIFEST: ${{ steps.draft.outputs.manifest }}
          ASSET_DIR: ${{ steps.draft.outputs.asset-dir }}
          VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ steps.draft.outputs.target-commitish }}
        run: ci/.github/scripts/verify-release.sh

      - name: Checkout the source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verify.outputs.source-ref }}
          path: src
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source is not stale
        working-directory: src
        env:
          SOURCE_COMMIT: ${{ steps.verify.outputs.source-commit }}
          SOURCE_BRANCH: ${{ steps.verify.outputs.source-ref }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" "origin/${SOURCE_BRANCH}"; then
            echo "error: prepared source commit $SOURCE_COMMIT is no longer an ancestor of origin/${SOURCE_BRANCH}: the candidate is stale and must be prepared again" >&2
            exit 1
          fi

      - name: Login to quay.io with the OIDC token of the job
        id: quay
        uses: wireapp/wire-rm-actions/quay-login@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          robot: wire+gha_wire-server

      - name: Install crane
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          DEST: ${{ runner.temp }}/crane
        run: |
          set -euo pipefail
          bash rm-actions/scripts/install-crane.sh
          echo "$DEST" >> "$GITHUB_PATH"

      - name: Promote the images (no rebuild)
        env:
          IMAGES_JSON: ${{ steps.verify.outputs.images-json }}
          TAG: ${{ steps.verify.outputs.version }}
          PROMOTE_IMAGE: ${{ github.workspace }}/rm-actions/scripts/promote-image.sh
        run: ci/.github/scripts/promote-images.sh

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Publish the charts to the OCI registry
        id: oci
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          CHARTS: ${{ steps.verify.outputs.charts }}
          CHART_DIR: ${{ steps.draft.outputs.asset-dir }}
          OCI_REPOSITORY: quay.io/wire/charts/${{ steps.verify.outputs.channel }}
          DIGESTS_FILE: ${{ runner.temp }}/chart-digests.json
          QUAY_USERNAME: ${{ steps.quay.outputs.username }}
          QUAY_PASSWORD: ${{ steps.quay.outputs.token }}
        run: ci/.github/scripts/publish-charts-oci.sh

      - name: Create or verify release/X.Y for the first GA of a minor
        if: steps.verify.outputs.type == 'ga'
        working-directory: src
        env:
          TARGET: ${{ steps.verify.outputs.version }}
          SOURCE_COMMIT: ${{ steps.verify.outputs.source-commit }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET" =~ ^([0-9]+)\.([0-9]+)\.0$ ]]; then
            echo "Not the first GA of a minor: no release branch to create."
            exit 0
          fi
          line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          existing=$(git ls-remote --heads origin "release/${line}" | awk 'NR==1 {print $1}')
          if [[ -z "$existing" ]]; then
            git push origin "${SOURCE_COMMIT}:refs/heads/release/${line}"
            echo "Created release/${line} at $SOURCE_COMMIT"
          elif [[ "$existing" == "$SOURCE_COMMIT" ]] || git merge-base --is-ancestor "$SOURCE_COMMIT" "$existing" 2>/dev/null; then
            echo "release/${line} already contains $SOURCE_COMMIT."
          else
            echo "error: release/${line} exists at $existing, which does not contain $SOURCE_COMMIT: refusing to move it" >&2
            exit 1
          fi

      - name: Docker logout
        if: always()
        run: docker logout quay.io

      - name: Complete the release manifests
        id: completed
        env:
          MANIFESTS: ${{ steps.verify.outputs.manifests }}
          OUT_DIR: ${{ runner.temp }}/completed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHART_DIGESTS_FILE: ${{ runner.temp }}/chart-digests.json
          RELEASE_MANIFEST: ${{ github.workspace }}/rm-actions/scripts/release-manifest.sh
        run: ci/.github/scripts/complete-manifests.sh

      - name: Publish the GitHub Release
        id: publish_release
        uses: wireapp/wire-rm-actions/draft-release@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: publish
          version: ${{ steps.verify.outputs.version }}
          release-id: ${{ steps.draft.outputs.id }}
          expected-commit: ${{ steps.verify.outputs.source-commit }}
          replace-assets: ${{ steps.completed.outputs.replace-assets }}
          source-ref: ${{ steps.verify.outputs.source-ref }}
          latest-branches: ^dev$

      - name: Release date
        id: released_at
        if: ${{ !cancelled() && steps.publish_release.outcome == 'success' }}
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Register the release with the release managers, one record per component
        if: ${{ !cancelled() && steps.publish_release.outcome == 'success' }}
        env:
          RM_STAGING_URL: ${{ vars.RM_STAGING_URL }}
          RM_STAGING_AUDIENCE: wire-release-manager-staging
          RM_PROD_URL: ${{ vars.RM_PROD_URL }}
          RM_PROD_AUDIENCE: wire-release-manager-prod
          VERSION: ${{ steps.verify.outputs.version }}
          KIND: ${{ steps.verify.outputs.kind }}
          COMMIT: ${{ steps.verify.outputs.source-commit }}
          BRANCH: ${{ steps.verify.outputs.source-ref }}
          COMPONENTS: ${{ steps.verify.outputs.components }}
          CHART_DIGESTS_FILE: ${{ runner.temp }}/chart-digests.json
          OCI_REPOSITORY: quay.io/wire/charts/${{ steps.verify.outputs.channel }}
          MANIFEST_DIR: ${{ steps.completed.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.verify.outputs.version }}
          RELEASED_AT: ${{ steps.released_at.outputs.date }}
          NOTE_FILE: ${{ steps.draft.outputs.body-file }}
          DECLARATION_FILE: ${{ steps.verify.outputs.declaration-file }}
          NOTIFY_RM: ${{ github.workspace }}/rm-actions/scripts/notify-rm.sh
        run: ci/.github/scripts/declare-release.sh

      - name: Summary
        if: ${{ !cancelled() && steps.publish_release.outcome == 'success' }}
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          CHANNEL: ${{ steps.verify.outputs.channel }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo
            echo "v${VERSION} published: ${RELEASE_URL}. Images promoted by digest, charts pushed to oci://quay.io/wire/charts/${CHANNEL}, 12 components declared to the release managers."
            echo
            echo "> :information_source: The S3 chart repositories and wire-builds are not updated during the PoC."
          } >> "$GITHUB_STEP_SUMMARY"
